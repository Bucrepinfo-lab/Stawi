# Daily scheduler — hits /api/cron (subscription dunning daily; SACCO+ interest
# accrual only when SACCO_PLUS_ENABLED=true). Daily is the least frequent schedule
# that keeps dunning accurate to the day.
# Set repo secrets: CRON_URL (https://stawi.fly.dev/api/cron) and CRON_SECRET.
name: Cron

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron
        run: |
          if [ -z "${{ secrets.CRON_URL }}" ]; then echo "CRON_URL not set — skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.CRON_URL }}" | tee /dev/stderr
